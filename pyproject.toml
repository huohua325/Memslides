[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memslides"
version = "1.0.0"
description = "Memory-aware presentation generation runtime"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4",
  "docker",
  "fake-useragent",
  "fastmcp",
  "filelock",
  "jinja2",
  "json-repair",
  "jsonlines",
  "markdownify",
  "openai",
  "httpx",
  "aiohttp",
  "aiosqlite",
  "colorlog",
  "numpy",
  "pillow",
  "playwright==1.60.0",
  "PyMuPDF",
  "pypdf",
  "pydantic",
  "python-pptx",
  "pyyaml",
  "trafilatura",
  "vl-convert-python",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
research = [
  "chromadb",
  "bm25s",
  "jieba",
  "PyStemmer",
  "markitdown",
]

[project.scripts]
memslides = "memslides.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# MCP wrappers support direct execution by adding the repository root before imports.
"src/memslides/tools/asset_services.py" = ["E402"]
"src/memslides/tools/document_conversion.py" = ["E402"]
"src/memslides/tools/memory_service.py" = ["E402"]
"src/memslides/tools/research.py" = ["E402"]
"src/memslides/tools/search.py" = ["E402"]

[tool.setuptools.package-data]
memslides = [
  "mcp.json",
  "mcp.json.example",
  "memslides*.yaml",
  "roles/*.yaml",
  "presentation_export/*.js",
  "presentation_export/package.json",
  "experiment/suites/*.yml",
  "experiment/suites/*.yaml",
  "memory/core/*.sql",
  "memory/template_guides/*.md",
  "memory/template_guides/prompts/*.j2",
]
